version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: directus_postgres
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  directus:
    image: directus/directus:11
    container_name: directus
    ports:
      - "8055:8055"
    environment:
      - KEY=${DIRECTUS_KEY:-aVerySecretKey}
      - SECRET=${DIRECTUS_SECRET:-anotherVerySecretSecret}
      - ADMIN_EMAIL=${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${DIRECTUS_ADMIN_PASSWORD:-admin1234}
      - DB_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=directus
      - DB_USER=directus
      - DB_PASSWORD=directus
      - WEBSOCKETS_ENABLED=true
      - CORS_ENABLED=${DIRECTUS_CORS_ENABLED:-true}
      - CORS_ORIGIN=${DIRECTUS_CORS_ORIGIN:-http://localhost:3000,http://nuxt:3000}
      - PUBLIC_URL=${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
    volumes:
      - ./uploads:/directus/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8055/server/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nuxt:
    build: .
    container_name: detki-nuxt
    ports:
      - "3000:3000"
    environment:
      - DIRECTUS_INTERNAL_URL=${DIRECTUS_INTERNAL_URL:-http://directus:8055}
      - DIRECTUS_PUBLIC_URL=${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      - DIRECTUS_STATIC_TOKEN=${DIRECTUS_STATIC_TOKEN:-}
      - NUXT_DIRECTUS_TOKEN=${DIRECTUS_STATIC_TOKEN:-}
      - NUXT_PUBLIC_DIRECTUS_URL=${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      - NUXT_PUBLIC_DIRECTUS_TOKEN=${DIRECTUS_STATIC_TOKEN:-}
    depends_on:
      directus:
        condition: service_healthy
    restart: unless-stopped
